plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace = 'org.llm4people.hermes'
    compileSdk = providers.gradleProperty('hermesCompileSdk').get().toInteger()
    buildToolsVersion = providers.gradleProperty('hermesBuildTools').get()

    defaultConfig {
        applicationId = namespace
        manifestPlaceholders = [hermesApplicationId: namespace]
        minSdk = providers.gradleProperty('hermesMinSdk').get().toInteger()
        targetSdk = providers.gradleProperty('hermesTargetSdk').get().toInteger()
        versionCode = providers.gradleProperty('hermesVersionCode').get().toInteger()
        versionName = providers.gradleProperty('hermesVersionName').get()
        testInstrumentationRunner = 'android.test.InstrumentationTestRunner'
        resourceConfigurations += ['fr', 'en']
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            excludes += [
                '**/*.proto',
                '**/*.kotlin_builtins',
                'DebugProbesKt.bin',
                'META-INF/*.kotlin_module',
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
            ]
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        aidl = false
        buildConfig = false
        renderScript = false
        resValues = false
        shaders = false
    }

    testOptions {
        unitTests.all {
            maxParallelForks = Math.max(1, Runtime.runtime.availableProcessors().intdiv(2))
        }
    }
}

def frameworkTestLibraries = androidComponents.sdkComponents.sdkDirectory.map { location ->
    def optional = location.dir("platforms/android-${android.compileSdk}/optional")
    ['android.test.runner', 'android.test.base'].collect { optional.file("${it}.jar") }
}

dependencies {
    implementation libs.firebase.messaging
    implementation libs.unifiedpush.connector
    androidTestCompileOnly files(frameworkTestLibraries)
    testImplementation libs.junit
}
