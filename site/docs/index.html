<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documentation | Hermes Mobile</title>
  <meta name="description" content="Hermes Mobile documentation: signed APK releases, QR pairing, multi-profile single-host setup, command palette, connection doctor, and security.">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="canonical" href="https://llm-4-people.github.io/hermes-mobile/en/docs/">
  <link rel="alternate" hreflang="en" href="https://llm-4-people.github.io/hermes-mobile/en/docs/">
  <link rel="alternate" hreflang="fr" href="https://llm-4-people.github.io/hermes-mobile/fr/docs/">
  <link rel="alternate" hreflang="x-default" href="https://llm-4-people.github.io/hermes-mobile/en/docs/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Documentation | Hermes Mobile">
  <meta property="og:description" content="Setup, QR pairing, security architecture, connection doctor, and signed release verification for Hermes Mobile.">
  <meta property="og:url" content="https://llm-4-people.github.io/hermes-mobile/docs/">
  <meta property="og:image" content="https://llm-4-people.github.io/hermes-mobile/assets/marketing/social-preview-en.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://llm-4-people.github.io/hermes-mobile/assets/marketing/social-preview-en.png">
  <script>(function(){try{var s=localStorage.getItem('hermes-site-theme');var t=s==='light'||s==='dark'?s:(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <link rel="stylesheet" href="../assets/style.css">
  <script>
    (function () {
      var target = 'en';
      try {
        var saved = window.localStorage.getItem('hermes_lang');
        if (saved === 'fr' || saved === 'en') {
          target = saved;
        } else {
          var langs = (Array.isArray(navigator.languages) && navigator.languages.length)
            ? navigator.languages
            : (navigator.language ? [navigator.language] : []);
          for (var i = 0; i < langs.length; i++) {
            var tag = String(langs[i] || '').trim().toLowerCase();
            if (tag === 'fr' || tag.indexOf('fr-') === 0 || tag.indexOf('fr_') === 0) { target = 'fr'; break; }
            if (tag === 'en' || tag.indexOf('en-') === 0 || tag.indexOf('en_') === 0) { target = 'en'; break; }
          }
        }
      } catch (e) {}
      var suffix = (window.location.search || '') + (window.location.hash || '');
      window.location.replace('../' + target + '/docs/' + suffix);
    })();
  </script>
</head>
<body class="router-page">
  <main class="router-card">
    <h1>Hermes Mobile documentation</h1>
    <p>Choose your documentation language / Choisissez la langue de la documentation</p>
    <div class="router-actions">
      <a class="btn btn-primary" href="../en/docs/">English documentation</a>
      <a class="btn btn-secondary" href="../fr/docs/">Documentation française</a>
    </div>
    <noscript>
      <p style="margin-top:16px;">JavaScript is disabled. Select a documentation language above.</p>
    </noscript>
  </main>
</body>
</html>
