  <link rel="stylesheet" href="./assets/style.css">
  <script>
    (function () {
      var target = 'en';
      try {
        var saved = window.localStorage.getItem('hermes_lang');
        if (saved === 'fr' || saved === 'en') {
          target = saved;
        } else {
          var langs = (Array.isArray(navigator.languages) && navigator.languages.length)
            ? navigator.languages
            : (navigator.language ? [navigator.language] : []);
          for (var i = 0; i < langs.length; i++) {
            var tag = String(langs[i] || '').trim().toLowerCase();
            if (tag === 'fr' || tag.indexOf('fr-') === 0 || tag.indexOf('fr_') === 0) { target = 'fr'; break; }
            if (tag === 'en' || tag.indexOf('en-') === 0 || tag.indexOf('en_') === 0) { target = 'en'; break; }
          }
        }
      } catch (e) {}
      var suffix = (window.location.search || '') + (window.location.hash || '');
      window.location.replace('./' + target + '/' + suffix);
    })();
  </script>
</head>
