<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hermes Mobile — Live Device Gallery</title>
  <meta name="description" content="Real Android phone and tablet screen captures from verified Hermes Mobile runs.">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="canonical" href="https://llm-4-people.github.io/hermes-mobile/en/walkthrough/">
  <link rel="alternate" hreflang="en" href="https://llm-4-people.github.io/hermes-mobile/en/walkthrough/">
  <link rel="alternate" hreflang="fr" href="https://llm-4-people.github.io/hermes-mobile/fr/walkthrough/">
  <link rel="alternate" hreflang="x-default" href="https://llm-4-people.github.io/hermes-mobile/en/walkthrough/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Hermes Mobile — Live Device Gallery">
  <meta property="og:description" content="Explore real Android phone and tablet captures from Hermes Mobile.">
  <meta property="og:url" content="https://llm-4-people.github.io/hermes-mobile/walkthrough/">
  <meta property="og:image" content="https://llm-4-people.github.io/hermes-mobile/assets/marketing/social-preview-en.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://llm-4-people.github.io/hermes-mobile/assets/marketing/social-preview-en.png">
  <link rel="stylesheet" href="../assets/style.css">
  <script>
    (function () {
      var target = 'en';
      try {
        var saved = window.localStorage.getItem('hermes_lang');
        if (saved === 'fr' || saved === 'en') {
          target = saved;
        } else {
          var langs = (Array.isArray(navigator.languages) && navigator.languages.length)
            ? navigator.languages
            : (navigator.language ? [navigator.language] : []);
          for (var i = 0; i < langs.length; i++) {
            var tag = String(langs[i] || '').trim().toLowerCase();
            if (tag === 'fr' || tag.indexOf('fr-') === 0 || tag.indexOf('fr_') === 0) { target = 'fr'; break; }
            if (tag === 'en' || tag.indexOf('en-') === 0 || tag.indexOf('en_') === 0) { target = 'en'; break; }
          }
        }
      } catch (e) {}
      var suffix = (window.location.search || '') + (window.location.hash || '');
      window.location.replace('../' + target + '/walkthrough/' + suffix);
    })();
  </script>
</head>
<body class="router-page">
  <main class="router-card">
    <h1>Hermes Mobile Gallery</h1>
    <p>Choose your gallery language / Choisissez la langue de la galerie</p>
    <div class="router-actions">
      <a class="btn btn-primary" href="../en/walkthrough/">English Gallery</a>
      <a class="btn btn-secondary" href="../fr/walkthrough/">Galerie française</a>
    </div>
    <noscript>
      <p style="margin-top:16px;">JavaScript is disabled. Select a gallery language above.</p>
    </noscript>
  </main>
</body>
</html>
