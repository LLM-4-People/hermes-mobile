name: Workspace checks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Rebuild the package from clean outputs before the release workflow calls its device gate
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: workspace-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'workflow_call' }}

jobs:
  changes:
    name: Route changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_workspace: ${{ steps.route.outputs.run_workspace }}
      run_android: ${{ steps.route.outputs.run_android }}
      run_push_acceptance: ${{ steps.route.outputs.run_push_acceptance }}
      run_pages_check: ${{ steps.route.outputs.run_pages_check }}
      docs_only: ${{ steps.route.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 2 }}
          persist-credentials: false
      - id: route
        name: Classify changed paths (fail-closed)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          RELEASE_MODE: ${{ inputs.release == true && '1' || '0' }}
        run: |
          args=(--event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA"
                --pr-labels-json "${PR_LABELS:-[]}"
                --github-output "$GITHUB_OUTPUT" --step-summary "$GITHUB_STEP_SUMMARY")
          if [[ "$RELEASE_MODE" == "1" ]]; then
            args+=(--release)
          fi
          python3 -B ci/ci_routing.py "${args[@]}"

  validate:
    name: Validate sources
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache compiled actionlint binary
        id: actionlint-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/tools
          key: actionlint-${{ runner.os }}-v1.7.12
      - name: Install actionlint on cache miss
        if: steps.actionlint-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          GOBIN="$RUNNER_TEMP/tools" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Run docs check and CI unit tests in parallel
        run: python3 -B scripts/fast_check.py --ci-only
      - name: Check workflows and shell
        run: |
          "$RUNNER_TEMP/tools/actionlint"
          shellcheck ci/*.sh

  pages-check:
    name: Pages site check
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_pages_check == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify static site structure and local assets
        run: python3 -B ci/check_pages.py

  workspace:
    name: Workspace tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_workspace == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.11.17'
          enable-cache: true
          cache-dependency-glob: server/requirements.txt
      - run: |
          uv venv "$RUNNER_TEMP/server-env"
          uv pip install --python "$RUNNER_TEMP/server-env/bin/python" -r server/requirements.txt
      - run: python3 -B scripts/fast_check.py --workspace-only --server-python "$RUNNER_TEMP/server-env/bin/python"

  package-debug:
    name: Android debug package
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run_android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: android
        uses: ./.github/actions/android
        with:
          gradle: ${{ inputs.release && 'clean' || 'cached' }}
      - name: Build debug + test APKs and run host unit tests
        run: python3 ci/gradle_check.py :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest
      - name: Generate debug APK SHA-256 checksum
        run: (cd app/build/outputs/apk/debug && sha256sum app-debug.apk > SHA256SUMS)
      - name: Upload installable debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
      - name: Upload framework instrumentation APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-tests
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  package:
    name: Android package
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.run_android == 'true' || needs.changes.outputs.run_push_acceptance == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: android
        uses: ./.github/actions/android
        with:
          gradle: ${{ inputs.release && 'clean' || 'cached' }}
      - name: Build release APK and run Android Lint
        run: python3 ci/gradle_check.py :app:assembleRelease :app:lintDebug
      - name: Rebuild the unsigned APK from clean outputs
        if: inputs.release == true
        run: |
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          cp "$apk" "$RUNNER_TEMP/release-reference.apk"
          python3 ci/gradle_check.py --no-build-cache --no-configuration-cache :app:clean :app:assembleRelease
          cmp "$RUNNER_TEMP/release-reference.apk" "$apk"
      - name: Exercise signing with a disposable key
        env:
          ANDROID_BUILD_TOOLS: ${{ steps.android.outputs.tools }}
        run: python3 ci/test_signing.py "$ANDROID_BUILD_TOOLS" app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/android-release-input"
      - name: Retain the verified release and its disposable device signature
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-input
          path: ${{ runner.temp }}/android-release-input/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  device:
    name: Android device
    needs: [changes, package-debug]
    if: ${{ !cancelled() && needs.changes.outputs.run_android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: android
        uses: ./.github/actions/android
      - name: Download the debug APK from this build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-debug
          path: app/build/outputs/apk/debug
      - name: Download its framework instrumentation APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-debug-tests
          path: app/build/outputs/apk/androidTest/debug
      - uses: ./.github/actions/avd-cache
        with:
          api-level: ${{ steps.android.outputs.sdk }}
      - name: Run framework instrumentation shard 1/2
        env:
          ANDROID_BUILD_TOOLS: ${{ steps.android.outputs.tools }}
          HERMES_DEVICE_SUITE: native
          HERMES_NATIVE_SHARD: 0/2
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ steps.android.outputs.sdk }}
          target: google_apis
          arch: x86_64
          avd-name: hermes-ci
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          script: ci/device-check.sh
      - name: Retain instrumentation reports (shard 1/2)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-device-reports-shard-0
          path: ${{ runner.temp }}/android-instrumentation/*.txt
          if-no-files-found: ignore

  device-native-1:
    name: Android device (native 2/2)
    needs: [changes, package-debug]
    if: ${{ !cancelled() && needs.changes.outputs.run_android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: android
        uses: ./.github/actions/android
      - name: Download the debug APK from this build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-debug
          path: app/build/outputs/apk/debug
      - name: Download its framework instrumentation APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-debug-tests
          path: app/build/outputs/apk/androidTest/debug
      - uses: ./.github/actions/avd-cache
        with:
          api-level: ${{ steps.android.outputs.sdk }}
      - name: Run framework instrumentation shard 2/2
        env:
          ANDROID_BUILD_TOOLS: ${{ steps.android.outputs.tools }}
          HERMES_DEVICE_SUITE: native
          HERMES_NATIVE_SHARD: 1/2
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ steps.android.outputs.sdk }}
          target: google_apis
          arch: x86_64
          avd-name: hermes-ci
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          script: ci/device-check.sh
      - name: Retain instrumentation reports (shard 2/2)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-device-reports-shard-1
          path: ${{ runner.temp }}/android-instrumentation/*.txt
          if-no-files-found: ignore

  device-live-core:
    name: Android device (live core)
    needs: [changes, package-debug]
    if: ${{ !cancelled() && needs.changes.outputs.run_android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: android
        uses: ./.github/actions/android
      - name: Download the debug APK from this build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-debug
          path: app/build/outputs/apk/debug
      - name: Download its framework instrumentation APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-debug-tests
          path: app/build/outputs/apk/androidTest/debug
      - uses: ./.github/actions/hermes-fixture
      - name: Install the fork's locked gateway dependencies
        run: |
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/hermes-env" \
            uv sync --project .fixture/hermes --frozen --group dev --no-install-project --extra sms
          uv pip install --python "$RUNNER_TEMP/hermes-env/bin/python" -r server/requirements.txt
      - name: Verify the notification bridge against real Hermes ledger writers
        env:
          HERMES_TEST_CHECKOUT: ${{ github.workspace }}/.fixture/hermes
        run: |
          "$RUNNER_TEMP/hermes-env/bin/python" -B -m unittest discover -s server/tests
      - name: Verify the conversational HTTP contract on the selected gateway
        run: |
          "$RUNNER_TEMP/hermes-env/bin/python" -B verification/conversation_cards.py --source .fixture/hermes \
            --output "$RUNNER_TEMP/hermes-conversation-cards/http"
      - uses: ./.github/actions/avd-cache
        with:
          api-level: ${{ steps.android.outputs.sdk }}
      - name: Run live API and conversation card journeys
        env:
          ANDROID_BUILD_TOOLS: ${{ steps.android.outputs.tools }}
          HERMES_DEVICE_SUITE: live-core
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ steps.android.outputs.sdk }}
          target: google_apis
          arch: x86_64
          avd-name: hermes-ci
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          script: ci/device-check.sh
      - name: Retain device journey captures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-device-captures
          path: ${{ runner.temp }}/hermes-device/**/*.png
          if-no-files-found: ignore
      - name: Retain card screenshots and gateway receipts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-conversation-cards
          path: |
            ${{ runner.temp }}/hermes-conversation-cards/*/conversation-cards.json
            ${{ runner.temp }}/hermes-conversation-cards/android/*.png
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}
          compression-level: 0

  device-journeys:
    name: Android device journeys
    needs: [changes, package-debug]
    if: ${{ !cancelled() && needs.changes.outputs.run_android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: android
        uses: ./.github/actions/android
      - name: Download the debug APK from this build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-debug
          path: app/build/outputs/apk/debug
      - name: Download its framework instrumentation APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-debug-tests
          path: app/build/outputs/apk/androidTest/debug
      - uses: ./.github/actions/hermes-fixture
      - name: Install the fork's locked gateway dependencies
        run: |
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/hermes-env" \
            uv sync --project .fixture/hermes --frozen --group dev --no-install-project --extra sms
      - uses: ./.github/actions/avd-cache
        with:
          api-level: ${{ steps.android.outputs.sdk }}
      - name: Run instrument, photo, and skill journeys
        env:
          ANDROID_BUILD_TOOLS: ${{ steps.android.outputs.tools }}
          HERMES_DEVICE_SUITE: journeys
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ steps.android.outputs.sdk }}
          target: google_apis
          arch: x86_64
          avd-name: hermes-ci
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          script: ci/device-check.sh
      - name: Retain the offline walkthrough, screenshots and gateway receipt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-thread-instruments
          path: |
            ${{ runner.temp }}/hermes-thread-instrument/thread-instrument.json
            ${{ runner.temp }}/hermes-thread-instrument/walkthrough.html
            ${{ runner.temp }}/hermes-thread-instrument/*.png
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}
          compression-level: 0
      - name: Retain system picker and staged skill evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-discussion-photo-skills
          path: |
            ${{ runner.temp }}/hermes-discussion-photo/vision-receipt.json
            ${{ runner.temp }}/hermes-discussion-photo/01-photo-brouillon.png
            ${{ runner.temp }}/hermes-discussion-photo/02-photo-reponse.png
            ${{ runner.temp }}/hermes-discussion-skills/skills-receipt.json
            ${{ runner.temp }}/hermes-discussion-skills/01-competence-recherche.png
            ${{ runner.temp }}/hermes-discussion-skills/02-competence-resume.png
            ${{ runner.temp }}/hermes-discussion-skills/03-competence-brouillon.png
            ${{ runner.temp }}/hermes-discussion-skills/04-competence-reponse.png
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}
          compression-level: 0

  phone-handoffs:
    name: Android phone handoffs
    needs: [changes, package-debug]
    if: ${{ !cancelled() && needs.changes.outputs.run_android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: android
        uses: ./.github/actions/android
      - name: Download the debug APK from this build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-debug
          path: app/build/outputs/apk/debug
      - uses: ./.github/actions/hermes-fixture
      - name: Install the fork's locked gateway dependencies
        run: |
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/hermes-env" \
            uv sync --project .fixture/hermes --frozen --group dev --no-install-project --extra sms
      - uses: ./.github/actions/avd-cache
        with:
          api-level: ${{ steps.android.outputs.sdk }}
      - name: Verify Android phone handoffs on a fresh emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ steps.android.outputs.sdk }}
          target: google_apis
          arch: x86_64
          avd-name: hermes-ci
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          script: bash ci/phone-action-check.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Retain Android phone action receipts and receiver captures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-phone-actions
          path: |
            ${{ runner.temp }}/hermes-phone-actions/*.json
            ${{ runner.temp }}/hermes-phone-actions/*.png
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}
          compression-level: 0

  nearby-guide:
    name: Android nearby guide
    needs: [changes, package-debug]
    if: ${{ !cancelled() && needs.changes.outputs.run_android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: android
        uses: ./.github/actions/android
      - name: Download the debug APK from this build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-debug
          path: app/build/outputs/apk/debug
      - name: Download its framework instrumentation APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-debug-tests
          path: app/build/outputs/apk/androidTest/debug
      - uses: ./.github/actions/hermes-fixture
      - name: Install the fork's locked gateway dependencies
        run: |
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/hermes-env" \
            uv sync --project .fixture/hermes --frozen --group dev --no-install-project --extra sms
      - uses: ./.github/actions/avd-cache
        with:
          api-level: ${{ steps.android.outputs.sdk }}
      - name: Verify Android foreground location and restaurant guide on a fresh emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ steps.android.outputs.sdk }}
          target: google_apis
          arch: x86_64
          avd-name: hermes-ci
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          script: bash ci/nearby-device-check.sh
      - name: Retain Android nearby restaurant guide evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-nearby-restaurants
          path: |
            ${{ runner.temp }}/hermes-nearby/nearby.json
            ${{ runner.temp }}/hermes-nearby/guide.png
            ${{ runner.temp }}/hermes-nearby/comparison.png
            ${{ runner.temp }}/hermes-nearby/detail.png
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}
          compression-level: 0

  aosp:
    name: Phone acceptance
    needs: [changes, package]
    if: ${{ !cancelled() && inputs.release != true && needs.changes.outputs.run_push_acceptance == 'true' }}
    uses: ./.github/workflows/unified-push.yml
