name: Signed Android release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional expected SemVer tag matching gradle.properties hermesVersionName (e.g. v0.3.0)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: signed-android-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/checks.yml
    with:
      release: true

  aosp:
    name: Phone acceptance
    needs: verify
    uses: ./.github/workflows/unified-push.yml

  release:
    name: Sign and publish APK
    needs: [verify, aosp]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: android-release
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: android
        uses: ./.github/actions/android
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-release-input
          path: ${{ runner.temp }}/android-release-input
      - name: Check that the AOSP phone exercised this exact unsigned payload
        env:
          VERIFIED_UNSIGNED_SHA256: ${{ needs.aosp.outputs.verified_unsigned_sha256 }}
        run: |
          [[ "$VERIFIED_UNSIGNED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          cd "$RUNNER_TEMP/android-release-input"
          echo "$VERIFIED_UNSIGNED_SHA256  app-release-unsigned.apk" | sha256sum --check
      - name: Sign and verify the package
        env:
          ANDROID_BUILD_TOOLS: ${{ steps.android.outputs.tools }}
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: ci/sign-apk.sh "$RUNNER_TEMP/android-release-input/app-release-unsigned.apk" "$RUNNER_TEMP/signed"
      - name: Verify expected tag and versioned APK name match signed manifest
        env:
          EXPECTED_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - "$RUNNER_TEMP/signed/release.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("ci").resolve()))
          from publish_release import expected_apk_name
          manifest_path = Path(sys.argv[1])
          metadata = json.loads(manifest_path.read_text(encoding="utf-8"))
          apk_name = expected_apk_name(metadata)
          if not (manifest_path.parent / apk_name).is_file():
              sys.exit(f"Signed APK {apk_name!r} missing from {manifest_path.parent}.")
          expected = os.environ.get("EXPECTED_TAG", "").strip()
          if expected and metadata["tag"] != expected:
              sys.exit(f"Expected release tag {expected!r} does not match signed manifest tag {metadata['tag']!r}.")
          PY
      - name: Reuse the verified APK from an earlier signing attempt
        env:
          ANDROID_BUILD_TOOLS: ${{ steps.android.outputs.tools }}
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/publish_release.py "$RUNNER_TEMP/signed" --recover-from "$RUNNER_TEMP/android-release-input/app-release-unsigned.apk"
      - name: Attest release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/signed/*
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/publish_release.py "$RUNNER_TEMP/signed"
