name: Android build environment
description: Select the project JDK, restore Gradle caches when enabled, and read Android versions from Gradle.
inputs:
  gradle:
    description: Set to cached for normal Gradle builds or clean for release verification.
    required: false
    default: none
outputs:
  sdk:
    description: Compile SDK level
    value: ${{ steps.versions.outputs.sdk }}
  tools:
    description: SDK build tools directory
    value: ${{ steps.versions.outputs.tools }}
runs:
  using: composite
  steps:
    - if: inputs.gradle != 'none'
      uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: '21'
        cache: ${{ inputs.gradle == 'cached' && 'gradle' || '' }}
        cache-jdk: false
    - name: Prepare the pinned Gradle distribution
      if: inputs.gradle != 'none'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BUILD_MODE: ${{ inputs.gradle }}
      run: |
        if [[ "$BUILD_MODE" == clean ]]; then
          export GRADLE_USER_HOME="$RUNNER_TEMP/gradle-release-home"
          echo "GRADLE_USER_HOME=$GRADLE_USER_HOME" >> "$GITHUB_ENV"
        fi
        python3 -B ci/gradle_distribution.py
    - id: versions
      shell: bash
      run: |
        set -eu
        sdk=$(sed -n 's/^hermesCompileSdk=//p' gradle.properties)
        tools=$(sed -n 's/^hermesBuildTools=//p' gradle.properties)
        [[ "$sdk" =~ ^[0-9]+$ && "$tools" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        echo "sdk=$sdk" >> "$GITHUB_OUTPUT"
        echo "tools=$ANDROID_HOME/build-tools/$tools" >> "$GITHUB_OUTPUT"
        if [[ ! -d "$ANDROID_HOME/platforms/android-$sdk" || ! -d "$ANDROID_HOME/build-tools/$tools" ]]; then
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-$sdk" "build-tools;$tools" > /dev/null
        fi
