name: Android build environment
description: Select the project JDK and read Android versions from Gradle.
outputs:
  sdk:
    description: Compile SDK level
    value: ${{ steps.versions.outputs.sdk }}
  tools:
    description: SDK build tools directory
    value: ${{ steps.versions.outputs.tools }}
runs:
  using: composite
  steps:
    - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: '21'
    - id: versions
      shell: bash
      run: |
        set -eu
        sdk=$(sed -n 's/^hermesCompileSdk=//p' gradle.properties)
        tools=$(sed -n 's/^hermesBuildTools=//p' gradle.properties)
        [[ "$sdk" =~ ^[0-9]+$ && "$tools" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        echo "sdk=$sdk" >> "$GITHUB_OUTPUT"
        echo "tools=$ANDROID_HOME/build-tools/$tools" >> "$GITHUB_OUTPUT"
        sdkmanager "platforms;android-$sdk" "build-tools;$tools" > /dev/null
