name: Pristine Android AVD snapshot cache
description: Enable KVM and restore or warm-and-save one clean, untouched Google APIs AVD quick-boot snapshot before any tests mutate the emulator.
inputs:
  api-level:
    description: Android API level for the Google APIs emulator
    required: true
  avd-name:
    description: Shared AVD name
    required: false
    default: hermes-ci
runs:
  using: composite
  steps:
    - name: Enable KVM
      shell: bash
      run: sudo chmod a+rw /dev/kvm
    - name: Restore pristine AVD snapshot
      id: avd-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.android/avd/*
          ~/.android/adb*
        key: avd-v1-${{ runner.os }}-api${{ inputs.api-level }}-google_apis-x86_64-${{ inputs.avd-name }}
    - name: Warm pristine AVD snapshot on cache miss
      if: steps.avd-cache.outputs.cache-hit != 'true'
      uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      with:
        api-level: ${{ inputs.api-level }}
        target: google_apis
        arch: x86_64
        avd-name: ${{ inputs.avd-name }}
        force-avd-creation: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: echo "Warmed pristine AVD snapshot for API ${{ inputs.api-level }}"
    - name: Save pristine AVD snapshot immediately before test mutations
      if: steps.avd-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.android/avd/*
          ~/.android/adb*
        key: avd-v1-${{ runner.os }}-api${{ inputs.api-level }}-google_apis-x86_64-${{ inputs.avd-name }}
