name: Hermes fixture source
description: Check out the gateway revision declared by the acceptance fixture and install its package manager.
runs:
  using: composite
  steps:
    - id: fixture
      shell: bash
      name: Read the reviewed Hermes revision
      run: |
        python3 -B - <<'PYTHON' >> "$GITHUB_OUTPUT"
        import runpy
        print("sha=" + runpy.run_path("verification/gateway_fixture.py")["PINNED_REVISION"])
        PYTHON
    - name: Check out the fixture gateway
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: LLM-4-People/hermes-agent
        ref: ${{ steps.fixture.outputs.sha }}
        path: .fixture/hermes
        persist-credentials: false
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: '0.11.17'
        enable-cache: false
