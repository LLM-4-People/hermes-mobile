name: Bug report
description: Report a reproducible defect in Hermes Mobile or its server bridge.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do **not** report security vulnerabilities here—use [GitHub Security Advisories](https://github.com/LLM-4-People/hermes-mobile/security/advisories/new) instead.
        Never paste access keys, bearer tokens, or private message transcripts.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Clear, concise description of the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact steps to trigger the issue.
      placeholder: |
        1. Open profile on ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Discussions, Coding, Diffs & Voice
        - Adaptive Shell, Biometrics & Android 16 OS Integration
        - Live UI Modding, Surfaces v2 & Widgets
        - Brain Studio & Universal Sharing
        - Zero-Root Ambient Intelligence
        - Push Bridge & Closed-App Delivery (FCM / UnifiedPush)
        - Single-Host Multi-Profile Deploy (/p/<profile>)
        - Documentation / Build / CI
    validations:
      required: true

  - type: input
    id: android_env
    attributes:
      label: Android version, device & app language
      placeholder: "e.g., Android 16 (API 36), Pixel 9 / Tablet 1200x800, Auto (English)"
    validations:
      required: true

  - type: input
    id: server_env
    attributes:
      label: Companion fork revision & deployment mode
      description: Hermes Mobile requires LLM-4-People/hermes-agent.
      placeholder: "e.g., LLM-4-People/hermes-agent @ eb99545c, single-host Caddy /p/<profile>"
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted Diagnostics export or error log (optional)
      description: Paste redacted Diagnostics entries or server log lines without credentials or URLs.
      render: text
    validations:
      required: false
